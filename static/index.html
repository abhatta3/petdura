<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Pet Service Search</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <div class="brand-header">
        <div class="logo-icon" aria-hidden="true">
          <svg viewBox="0 0 64 64" width="36" height="36" fill="currentColor">
            <!-- Dog silhouette -->
            <path d="M18 26c-2.2 0-4 1.8-4 4v10c0 4.4 3.6 8 8 8h2c1.1 0 2-.9 2-2v-6h4v6c0 1.1.9 2 2 2h2c4.4 0 8-3.6 8-8V30c0-2.2-1.8-4-4-4-1.2 0-2.3.5-3 1.4C32.4 25.5 30.8 25 29 25c-1.8 0-3.4.5-4.7 1.4-.7-.9-1.8-1.4-3-1.4zm-3-8c-1.7 0-3 1.3-3 3s1.3 3 3 3 3-1.3 3-3-1.3-3-3-3zm6-4c-1.7 0-3 1.3-3 3s1.3 3 3 3 3-1.3 3-3-1.3-3-3-3z"/>
            <!-- Cat silhouette -->
            <path d="M48 20c-1.5 0-2.8 1-3.2 2.4-1.1-.9-2.5-1.4-4-1.4-1.9 0-3.6.8-4.8 2.1-.9-1.2-2.3-2.1-4-2.1-2.8 0-5 2.2-5 5v8c0 3.3 2.7 6 6 6h10c3.3 0 6-2.7 6-6v-8c0-1.4-.5-2.6-1.3-3.6.4-.8.6-1.6.6-2.4 0-2.2-1.8-4-4-4zm-14 3c.6 0 1.1.3 1.4.8l1 1.6c.4.6 1.1 1 1.9 1s1.5-.4 1.9-1l1-1.6c.3-.5.8-.8 1.4-.8.8 0 1.5.7 1.5 1.5 0 .5-.2 1-.6 1.3l-1.8 1.4c-.6.5-.9 1.3-.9 2.1v2.7h-6v-2.7c0-.8-.3-1.6-.9-2.1l-1.8-1.4c-.4-.3-.6-.8-.6-1.3 0-.8.7-1.5 1.5-1.5z"/>
          </svg>
        </div>
        <p class="eyebrow">PETDURA</p>
      </div>
      <h1>Find local pet care without the clutter.</h1>
      <p class="subtitle">Enter a ZIP code to find nearby pet care services, or browse all locations in the ZIP Codes Directory.</p>
    </header>

    <nav class="tab-bar">
      <button id="tab-search" class="tab-btn active" type="button">Search Services</button>
      <button id="tab-zips" class="tab-btn" type="button">ZIP Codes Directory</button>
    </nav>

    <div id="view-search" class="tab-content">
      <form id="search-form" class="search-card">
        <label for="zip-input">ZIP code</label>
        <input id="zip-input" name="zip_code" type="text" inputmode="numeric"
          pattern="[0-9]{5}" maxlength="5" autocomplete="postal-code"
          placeholder="90001" value="90001" required>

        <div class="filters">
          <label class="filter-field" for="source-filter">Source
            <select id="source-filter"><option value="">All sources</option></select>
          </label>
          <label class="filter-field" for="service-filter">Service
            <select id="service-filter"><option value="">All services</option></select>
          </label>
          <label class="filter-field" for="sort-by">Sort by
            <select id="sort-by">
              <option value="relevance">Best match</option>
              <option value="rating">Highest rated</option>
              <option value="reviews">Most reviewed</option>
              <option value="price">Lowest price</option>
              <option value="provider">Provider name</option>
            </select>
          </label>
        </div>

        <div class="form-actions">
          <button id="search-btn" type="submit">Search services</button>
          <p id="catalog-summary" class="catalog-summary"></p>
        </div>
      </form>

      <section id="controls-panel" class="panel hidden">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">RESULTS</p>
            <h2 id="results-title">Services</h2>
          </div>
          <p id="results-count"></p>
        </div>
      </section>

      <section id="results-panel" class="results-grid" aria-live="polite"></section>
      <p id="status-message" role="status"></p>
    </div>

    <div id="view-zips" class="tab-content hidden">
      <section class="panel">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">DIRECTORY</p>
            <h2>All ZIP Codes in Catalog</h2>
          </div>
          <p id="zip-count-badge"></p>
        </div>
        <div class="zip-controls" style="margin-top: 16px; display: flex; gap: 16px; align-items: center;">
          <label for="zip-limit-select" style="font-size: 0.85rem; font-weight: 700; color: var(--muted);">Show:
            <select id="zip-limit-select" style="display: inline-block; width: auto; margin-left: 6px; padding: 6px 10px;">
              <option value="100" selected>100</option>
              <option value="250">250</option>
              <option value="500">500</option>
              <option value="all">All</option>
            </select>
          </label>
        </div>
        <div class="table-container">
          <table id="zip-table" class="data-table">
            <thead>
              <tr>
                <th>ZIP Code</th>
                <th>Address</th>
                <th>Sources</th>
                <th>Count</th>
              </tr>
            </thead>
            <tbody id="zip-tbody">
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
